<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Dataset | ProbStat Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
  {% include 'navbar.html' %}
  <main class="page-shell">
    <div class="container py-5">
      {% include 'partials_flash.html' ignore missing %}
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="tool-panel">
            <div class="panel-heading">
              <i class="bi bi-cloud-arrow-up"></i>
              <div>
                <h1>Upload CSV Dataset</h1>
                <p>Files must be CSV format and no larger than 20MB.</p>
              </div>
            </div>
            <form method="post" enctype="multipart/form-data" class="upload-zone">
              <input class="form-control form-control-lg" type="file" name="dataset" accept=".csv" required>
              <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-upload"></i> Analyze Dataset</button>
            </form>
            <div class="mt-4">
              <h2 class="h5">Sample dataset</h2>
              <p class="text-secondary mb-1">A sample CSV is included at <code>dataset_samples/sample_measurements.csv</code>.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
